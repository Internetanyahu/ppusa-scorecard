name: Compile Conservative Scorecard

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: data-commit
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scorecard:
    name: Compile user scorecards
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Diagnose Power Play with the real scraper request pattern
        run: python scraper/diagnose_ppusa_pattern.py
      - name: Inspect Power Play resolution API sources
        run: python scraper/diagnose_ppusa_resolution_api.py
      - name: Refresh current Power Play player roster
        run: python scraper/main.py
      - name: Scrape Power Play in-game clock
        run: python scraper/game_time.py
      - name: Rebuild user identity history
        run: python scraper/build_history.py
      - name: Compile conservative scorecard, pending bills, and decay
        run: python scraper/scorecard.py
      - name: Build combined voting records
        run: python scraper/build_records.py
      - name: Build website data
        run: |
          set -e
          mkdir -p public/data
          cp bills.json public/data/bills.json
          cp conservative_scorecard.json public/data/conservative_scorecard.json
          cp legislative_history.json public/data/legislative_history.json
          cp players.json public/data/players.json
          cp scorecard_rules.json public/data/scorecard_rules.json
          cp voting_records.json public/data/voting_records.json
          cp game_time.json public/data/game_time.json
          python - <<'PY'
          import json
          from pathlib import Path
          required = ["bills.json","conservative_scorecard.json","legislative_history.json","players.json","scorecard_rules.json","voting_records.json","game_time.json"]
          for name in required:
              path = Path("public/data") / name
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty website data file: {path}")
              json.loads(path.read_text())
              print(f"OK: {path} ({path.stat().st_size} bytes)")
          PY
      - name: Build Discord share pages for every player
        run: python scraper/build_share_pages.py
      - name: Validate outputs
        run: |
          python -c '
          import json
          from pathlib import Path
          for f in ["bills.json","players.json","player_index.json","legislative_history.json","voting_records.json","conservative_scorecard.json","scorecard_review.json","game_time.json"]:
              json.loads(Path(f).read_text())
          scorecard = json.loads(Path("conservative_scorecard.json").read_text())
          share_root = Path("public/share")
          if not share_root.exists(): raise SystemExit("Missing generated Discord share pages")
          share_pages = list(share_root.glob("*/index.html"))
          share_images = list(share_root.glob("*/scorecard.png"))
          expected_players = [p for p in scorecard.get("players", []) if p.get("user_id") is not None or p.get("player_id") is not None]
          if len(share_pages) != len(expected_players): raise SystemExit(f"Expected {len(expected_players)} share pages, found {len(share_pages)}")
          if len(share_images) != len(expected_players): raise SystemExit(f"Expected {len(expected_players)} share images, found {len(share_images)}")
          print(f"Validated {len(expected_players)} player scorecards and Discord previews.")
          for bill in scorecard.get("bills", {}).values():
              for provision in bill.get("scorecard", {}).get("provisions", []):
                  name = str(provision.get("name", "")).strip().lower(); direction = provision.get("direction"); scorable = provision.get("scorable", True)
                  if name == "custom bill" and (direction != 0 or scorable is not False): raise SystemExit("Custom Bill must be neutral")
                  elif scorable is False and direction != 0: raise SystemExit("Neutral provision must have direction 0")
                  elif scorable is not False and direction not in (-1, 1): raise SystemExit("Invalid provision direction")
          print("All scorecard outputs validated, including neutral Custom Bills.")
          '
      - name: Commit compiled data and player previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json player_index.json legislative_history.json voting_records.json conservative_scorecard.json scorecard_rules.json identity_review.json scorecard_review.json game_time.json public/data public/share
          git diff --cached --quiet || git commit -m "Update conservative scorecard"
          git pull --rebase
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
