name: Compile Conservative Scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: data-commit
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scorecard:
    name: Compile user scorecards
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild user identity history
        run: python scraper/build_history.py

      - name: Apply deterministic conservative scorecard
        run: python scraper/scorecard.py

      - name: Build combined voting records
        run: python scraper/build_records.py

      - name: Build website data
        run: |
          mkdir -p public/data
          cp bills.json public/data/bills.json
          cp conservative_scorecard.json public/data/conservative_scorecard.json
          cp legislative_history.json public/data/legislative_history.json
          cp players.json public/data/players.json
          cp scorecard_rules.json public/data/scorecard_rules.json
          cp voting_records.json public/data/voting_records.json

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for f in [
              "bills.json",
              "players.json",
              "player_index.json",
              "legislative_history.json",
              "voting_records.json",
              "conservative_scorecard.json",
              "scorecard_review.json",
          ]:
              json.loads(Path(f).read_text())

          scorecard = json.loads(
              Path("conservative_scorecard.json").read_text()
          )

          json.loads(
              Path(
                  "public/data/conservative_scorecard.json"
              ).read_text()
          )

          # Normal provisions must have direction +1/-1.
          #
          # Custom Bill provisions are intentionally neutral:
          # direction 0, scorable false.
          #
          # Custom Bills must never affect a user's score.
          for bill in scorecard.get("bills", {}).values():
              for provision in bill.get(
                  "scorecard", {}
              ).get("provisions", []):

                  name = str(
                      provision.get("name", "")
                  ).strip().lower()

                  direction = provision.get(
                      "direction"
                  )

                  scorable = provision.get(
                      "scorable",
                      True,
                  )

                  if name == "custom bill":
                      if (
                          direction != 0
                          or scorable is not False
                      ):
                          raise SystemExit(
                              "Custom Bill must be neutral "
                              "(direction 0, scorable false): "
                              f"{provision!r}"
                          )

                  elif scorable is False:
                      if direction != 0:
                          raise SystemExit(
                              "Neutral provision must have direction 0: "
                              f"{provision!r}"
                          )

                  elif direction not in (-1, 1):
                      raise SystemExit(
                          "Invalid provision direction for "
                          f"resolution "
                          f"{bill.get('resolution_id')}: "
                          f"{direction!r}"
                      )

          print(
              "All scorecard outputs validated, "
              "including neutral Custom Bills."
          )
          PY

      - name: Commit compiled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json player_index.json legislative_history.json voting_records.json conservative_scorecard.json scorecard_review.json identity_review.json scorecard_rules.json public/data
          git diff --cached --quiet || git commit -m "Update conservative scorecard"
          git pull --rebase
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
