name: Compile Conservative Scorecard

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: data-commit
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scorecard:
    name: Compile user scorecards
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Refresh current Power Play player roster
        run: python scraper/main.py
      - name: Scrape Power Play in-game clock
        run: python scraper/game_time.py
      - name: Rebuild user identity history
        run: python scraper/build_history.py
      - name: Normalize editable scorecard rules
        run: python scraper/normalize_scorecard_rules.py
      - name: Compile conservative scorecard, pending bills, and decay
        run: python scraper/scorecard.py
      - name: Build all configurable scorecard sets
        run: python scraper/build_scorecard_sets.py
      - name: Build combined voting records
        run: python scraper/build_records.py
      - name: Build website data
        run: |
          set -e
          mkdir -p public/data
          cp bills.json public/data/bills.json
          cp conservative_scorecard.json public/data/conservative_scorecard.json
          cp scorecard_sets.json public/data/scorecard_sets.json
          cp scorecard_sets_config.json public/data/scorecard_sets_config.json
          cp legislative_history.json public/data/legislative_history.json
          cp players.json public/data/players.json
          cp scorecard_rules.json public/data/scorecard_rules.json
          cp voting_records.json public/data/voting_records.json
          cp game_time.json public/data/game_time.json
          python - <<'PY'
          import json
          from pathlib import Path
          required = ["bills.json","conservative_scorecard.json","scorecard_sets.json","scorecard_sets_config.json","legislative_history.json","players.json","scorecard_rules.json","voting_records.json","game_time.json"]
          for name in required:
              path = Path("public/data") / name
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty website data file: {path}")
              json.loads(path.read_text())
              print(f"OK: {path} ({path.stat().st_size} bytes)")
          PY
      - name: Build Discord share pages for every player
        run: python scraper/build_share_pages.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for f in ["bills.json","players.json","player_index.json","legislative_history.json","voting_records.json","conservative_scorecard.json","scorecard_sets.json","scorecard_sets_config.json","scorecard_review.json","game_time.json"]:
              json.loads(Path(f).read_text())
          scorecard=json.loads(Path("conservative_scorecard.json").read_text())
          sets=json.loads(Path("scorecard_sets.json").read_text())
          config=json.loads(Path("scorecard_sets_config.json").read_text())
          if not sets.get("sets"): raise SystemExit("No scorecard sets were generated")
          if not config.get("sets"): raise SystemExit("No scorecard sets are configured")
          share_root=Path("public/share")
          if not share_root.exists(): raise SystemExit("Missing generated Discord share pages")
          share_pages=list(share_root.glob("*/index.html")); share_images=list(share_root.glob("*/scorecard.png"))
          expected_players=[p for p in scorecard.get("players",[]) if p.get("user_id") is not None or p.get("player_id") is not None]
          if len(share_pages)!=len(expected_players): raise SystemExit(f"Expected {len(expected_players)} share pages, found {len(share_pages)}")
          if len(share_images)!=len(expected_players): raise SystemExit(f"Expected {len(expected_players)} share images, found {len(share_images)}")
          for set_data in sets["sets"]:
              for bill in set_data.get("bills",{}).values():
                  for provision in bill.get("scorecard",{}).get("provisions",[]):
                      direction=provision.get("direction"); scorable=provision.get("scorable",True)
                      if scorable is False and direction != 0: raise SystemExit(f"Neutral provision has non-zero direction in {set_data['id']}: {provision.get('name')}")
                      if direction not in (-1,0,1): raise SystemExit(f"Invalid provision direction in {set_data['id']}: {provision.get('name')}")
                      if scorable and direction not in (-1,1): raise SystemExit(f"Scorable provision must be +1 or -1 in {set_data['id']}: {provision.get('name')}")
          print(f"Validated {len(expected_players)} player previews and {len(sets['sets'])} scorecard sets.")
          print("Neutral provisions are allowed and excluded from scoring.")
          PY
      - name: Commit compiled data and player previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json player_index.json legislative_history.json voting_records.json conservative_scorecard.json scorecard_sets.json scorecard_sets_config.json scorecard_rules.json identity_review.json scorecard_review.json game_time.json public/data public/share
          git diff --cached --quiet || git commit -m "Update scorecard sets"
          git pull --rebase
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
