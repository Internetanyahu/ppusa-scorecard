name: Update Power Play data

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Run player scraper
        run: python scraper/main.py

      - name: Run voting scraper
        run: python scraper/votes.py

      - name: Run bill scraper
        run: python scraper/bills.py

      - name: Build player index and legislative history
        run: python scraper/build_history.py

      - name: Save scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json votes.json bills.json player_index.json legislative_history.json
          git diff --cached --quiet || git commit -m "Update Power Play data"
          git push
