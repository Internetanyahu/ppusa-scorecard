name: Update players and records

# Rebuilds players.json and every derived file from the bills.json already in
# the repo. It does NOT scrape bills (see bills.yml / the Chrome extension).
on:
  workflow_dispatch:

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Run player scraper
        run: python scraper/main.py

      - name: Build player index and legislative history
        run: python scraper/build_history.py

      - name: Build combined voting records
        run: python scraper/build_records.py

      - name: Save scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json player_index.json legislative_history.json voting_records.json identity_review.json
          git diff --cached --quiet || git commit -m "Update players and records"
          git pull --rebase
          git push
