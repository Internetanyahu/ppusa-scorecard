name: Fix label rendering error
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')
          old = "const label = v =>"
          new = "const formatLabel = v =>"
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('label(', 'formatLabel(')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-label-error.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js .github/workflows/fix-label-error.yml
          git diff --cached --quiet || git commit -m 'Fix label shadowing in scorecard renderer'
          git push