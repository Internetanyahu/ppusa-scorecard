name: Fix profile office display order

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile display order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text()
          old1 = "const text = `${x.name} · ${location} · ${officeText(x)}`;"
          new1 = "const text = `${x.name} · ${officeText(x)} · ${x.state || ''}`;"
          old2 = "<span>${esc([p.chamber, p.state].filter(Boolean).join(' · '))}</span><span class=\"office-detail\"><strong>Office:</strong> ${esc(officeText(p))}</span>"
          new2 = "<span>${esc([officeText(p), p.state].filter(Boolean).join(' · '))}</span>"
          if old1 not in s:
              raise SystemExit('Expected player profile display expression was not found')
          if old2 not in s:
              raise SystemExit('Expected player dialog profile display expression was not found')
          s = s.replace(old1, new1)
          s = s.replace(old2, new2)
          p.write_text(s)
          PY
          node --check public/app.js
      - name: Cache bust
        run: sed -i 's/app.js?v=20261022d/app.js?v=20261022e/' public/index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/index.html
          git diff --cached --quiet && { echo 'No changes required'; exit 0; }
          git commit -m 'Fix profile office display order'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-profile-office-order.yml || true
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time profile display repair workflow'
          git push