name: Check inactive player offices

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

concurrency:
  group: data-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  offices:
    name: Check offices for players without a vote in 5 days
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check only inactive players from main wiki pages
        env:
          PYTHONUNBUFFERED: "1"
          SCRAPER_TOKEN: ${{ secrets.SCRAPER_TOKEN }}
        run: python -u scraper/check_offices.py --days 5

      - name: Save office checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offices.json offices_debug.json
          git diff --cached --quiet || git commit -m "Check inactive player offices"
          git pull --rebase
          git push
